
name: physio_at_home
description: "Physiotherapy booking and healthcare application."

publish_to: 'none'

version: 2.0.0+2


# ================================================================
# DART / FLUTTER SDK
# ================================================================

environment:
  sdk: ^3.10.1


# ================================================================
# DEPENDENCIES
# ================================================================

dependencies:
  flutter:
    sdk: flutter

  # --------------------------------------------------------------
  # UI
  # --------------------------------------------------------------

  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_places_flutter: ^2.1.1

  # ==============================================================
  # FIREBASE
  # ==============================================================

  firebase_core: ^4.14.0
  firebase_auth: ^6.6.0
  url_launcher: ^6.3.2
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.0.6

  # --------------------------------------------------------------
  # LOCAL STORAGE
  # --------------------------------------------------------------

  shared_preferences: ^2.5.5


# ================================================================
# DEV DEPENDENCIES
# ================================================================

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App launcher icons for Android and iOS
  flutter_launcher_icons: ^0.14.4


# ================================================================
# APP LAUNCHER ICON CONFIGURATION
# ================================================================

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/app_icon.png"

  # Android adaptive icon
  adaptive_icon_background: "#003B57"
  adaptive_icon_foreground: "assets/images/app_icon.png"

  # iOS icon
  remove_alpha_ios: true


# ================================================================
# FLUTTER
# ================================================================

flutter:
  uses-material-design: true

  # ==============================================================
  # ASSETS
  # ==============================================================

  assets:
    # Main images
    - assets/images/

    # Condition images
    - assets/images/conditions/

    # Doctor / physiotherapist images
    - assets/images/doctors/

    # Recommendation images
    - assets/images/recommendations/

    # Explore screen images
    - assets/images/explore/
