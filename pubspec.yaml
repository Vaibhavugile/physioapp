name: physio_at_home
description: "Physiotherapy booking and healthcare application."

publish_to: 'none'

version: 1.0.0+1


# ================================================================
# DART / FLUTTER SDK
# ================================================================

environment:
  sdk: ^3.10.1


# ================================================================
# DEPENDENCIES
# ================================================================

dependencies:
  flutter:
    sdk: flutter


  # --------------------------------------------------------------
  # UI
  # --------------------------------------------------------------

  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_places_flutter: ^2.1.1


  # ==============================================================
  # FIREBASE
  # ==============================================================

  # Firebase initialization
  firebase_core: ^4.14.0


  # User authentication
  firebase_auth: ^6.6.0


  # Database
  cloud_firestore: ^6.9.0


  # Images / files / profile pictures
  firebase_storage: ^13.0.6


  # --------------------------------------------------------------
  # LOCAL STORAGE
  # --------------------------------------------------------------

  # Small local preferences and cached values
  shared_preferences: ^2.5.5


# ================================================================
# DEV DEPENDENCIES
# ================================================================

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


# ================================================================
# FLUTTER
# ================================================================

flutter:

  uses-material-design: true


  # ==============================================================
  # ASSETS
  # ==============================================================

  assets:

    # Main images
    - assets/images/

    # Condition images
    - assets/images/conditions/

    # Doctor / physiotherapist images
    - assets/images/doctors/

    # Recommendation images
    - assets/images/recommendations/

    # Explore screen images
    - assets/images/explore/